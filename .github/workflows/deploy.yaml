
name: Build and Deploy Task Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-manager-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "633160613557"
  FRONTEND_REPOSITORY: dtsm-frontend
  BACKEND_REPOSITORY: dtsm-backend

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-frontend:${{ github.sha }}
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-frontend:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-backend:${{ github.sha }}
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SSH Secrets and Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' \
            > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" \
              > /dev/null 2> "$RUNNER_TEMP/key-error.log"; then
            echo "ERROR: EC2_SSH_KEY is invalid."
            cat "$RUNNER_TEMP/key-error.log"
            exit 1
          fi

          echo "SSH private key is valid."
          echo "EC2 host value is configured."

      - name: Check EC2 SSH Port
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -eu

          echo "Checking TCP port 22 on EC2..."

          if timeout 10 bash -c \
            'exec 3<>/dev/tcp/$1/22' _ "$EC2_HOST"; then
            echo "Port 22 is reachable."
          else
            echo "ERROR: GitHub Actions cannot reach EC2 port 22."
            echo "Check EC2_HOST, public IP, security group, route table and network ACL."
            exit 1
          fi

      - name: Configure SSH Host Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -eu

          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if ! ssh-keyscan -T 10 -t ed25519,rsa \
              -H "$EC2_HOST" \
              >> "$HOME/.ssh/known_hosts" \
              2> "$RUNNER_TEMP/keyscan-error.log"; then
            echo "ERROR: Could not retrieve EC2 SSH host key."
            cat "$RUNNER_TEMP/keyscan-error.log"
            exit 1
          fi

          if ! ssh-keygen -F "$EC2_HOST" \
              -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo "ERROR: EC2 host key was not recorded."
            exit 1
          fi

          echo "Host key retrieved. Verify it independently before production use."

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            'echo "SSH connection successful"'

      - name: Prepare EC2 Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" \
            'mkdir -p ~/devops-task-manager'

      - name: Copy Docker Compose File
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ubuntu@"$EC2_HOST":~/devops-task-manager/docker-compose.yml

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID' bash -s" <<'REMOTE'
          set -eu

          cd ~/devops-task-manager

          if [ ! -f .env ]; then
            echo "ERROR: EC2 .env file is missing."
            exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "ERROR: AWS CLI is not installed on EC2."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "ERROR: Docker Compose is not installed on EC2."
            exit 1
          fi

          # Use the EC2 instance role, not GitHub's AWS access keys.
          aws sts get-caller-identity

          # Log in to ECR.
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          export FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dtsm-frontend:${IMAGE_TAG}"
          export BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dtsm-backend:${IMAGE_TAG}"

          # Validate configuration and deploy.
          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE
