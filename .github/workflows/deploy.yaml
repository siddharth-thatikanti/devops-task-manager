name: Build and Deploy Task Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-manager-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "633160613557"
  FRONTEND_REPOSITORY: dtsm-frontend
  BACKEND_REPOSITORY: dtsm-backend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-frontend:${{ github.sha }}
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-frontend:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-backend:${{ github.sha }}
            633160613557.dkr.ecr.ap-southeast-2.amazonaws.com/dtsm-backend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing or empty."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing or empty."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" \
              > /dev/null 2> "$RUNNER_TEMP/ssh-key-error.log"; then
            echo "ERROR: EC2_SSH_KEY is not a valid private key."
            cat "$RUNNER_TEMP/ssh-key-error.log"
            exit 1
          fi

          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Checking SSH connectivity to EC2..."

          if ! ssh-keyscan -T 10 -v -H "$EC2_HOST" \
              >> "$HOME/.ssh/known_hosts" \
              2> "$RUNNER_TEMP/ssh-keyscan.log"; then
            echo "ERROR: ssh-keyscan could not retrieve the EC2 host key."
            echo "Check EC2_HOST, public IP, port 22, security group, and network."
            cat "$RUNNER_TEMP/ssh-keyscan.log"
            exit 1
          fi

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: No SSH host key was retrieved."
            exit 1
          fi

          echo "SSH key validated and host key retrieved."

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            'echo "SSH connection successful"'

      - name: Prepare EC2 Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" \
            'mkdir -p ~/devops-task-manager'

      - name: Copy Compose File to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ubuntu@"$EC2_HOST":~/devops-task-manager/docker-compose.yml

      - name: Pull Images and Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' AWS_REGION='${AWS_REGION}' AWS_ACCOUNT_ID='${AWS_ACCOUNT_ID}' bash -s" <<'REMOTE'
          set -eu

          cd ~/devops-task-manager

          if [ ! -f .env ]; then
            echo "ERROR: ~/devops-task-manager/.env is missing."
            echo "Create it with DB_NAME, DB_USER, and DB_PASSWORD."
            exit 1
          fi

          # Use the EC2 instance role for AWS access.
          aws sts get-caller-identity

          # Authenticate Docker to ECR.
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Deploy the exact images built for this commit.
          export FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dtsm-frontend:${IMAGE_TAG}"
          export BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dtsm-backend:${IMAGE_TAG}"

          # Validate, pull and start the application.
          docker compose config --quiet
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE
